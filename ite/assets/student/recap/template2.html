<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Student Recap - GARA</title>
    
    
    <script src="../../components/cdn.tailwindcss.com/index.js"></script>
    
    
    <link href="../../components/fonts.googleapis.com/css/family_Plus_Jakarta_Sans_wght_400_500_700_800_display_swap.css" rel="stylesheet">
    
    
    <link rel="stylesheet" href="../../components/cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #000;
            overflow: hidden;
            color: white;
        }

        
        ::-webkit-scrollbar { display: none; }

        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes popIn { 
            0% { transform: scale(0.9); opacity: 0; } 
            100% { transform: scale(1); opacity: 1; } 
        }
        @keyframes float { 
            0%, 100% { transform: translateY(0px); } 
            50% { transform: translateY(-10px); } 
        }
        @keyframes typing {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }
        @keyframes twinkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        
        .animate-fade-in { animation: fadeIn 1s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .animate-pop { animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-twinkle { animation: twinkle 3s ease-in-out infinite; }
        
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-500 { animation-delay: 500ms; }
        .delay-700 { animation-delay: 700ms; }

        

        
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        
        .grid-pattern-light {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, #f0f0f0 1px, transparent 1px),
                              linear-gradient(to bottom, #f0f0f0 1px, transparent 1px);
        }
        
        .grid-pattern-dark {
            background-size: 50px 50px;
            background-image: linear-gradient(to right, rgba(255,255,255,0.08) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255,255,255,0.08) 1px, transparent 1px);
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        }

        
        .noise-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.08;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        
        .star-shape {
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            background: white;
        }
        
        
        .progress-container {
            display: flex; gap: 4px; padding: 12px 0;
            position: absolute; top: 0; left: 16px; right: 16px; z-index: 60;
        }
        .progress-bg {
            height: 2px;
            background: rgba(255, 255, 255, 0.2);
            flex: 1; border-radius: 2px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: white; width: 0%;
            box-shadow: 0 0 8px rgba(255,255,255,0.8);
        }

        
        .typing-dots::after {
            content: ''; animation: typing 1.5s infinite;
            display: inline-block; width: 1em; text-align: left;
        }

        
        .glow-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
        }
    </style>
</head>
<body>

    
    <div id="loading-screen" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-white transition-opacity duration-1000">
        
        <div class="absolute inset-0 grid-pattern-light opacity-60"></div>
        
        <div class="relative z-10 text-center">
            <h2 class="text-xl font-bold text-black tracking-tight mb-2">
                Hal keren akan muncul sebentar lagi<span class="typing-dots"></span>
            </h2>
        </div>
    </div>

    
    <div id="app-container" class="fixed inset-0 hidden flex items-center justify-center bg-[#0a0a0a]">
        
        
        <div id="blur-bg" class="absolute inset-0 bg-cover bg-center opacity-30 blur-3xl transition-all duration-1000 transform scale-110"></div>

        
        <div id="story-viewport" class="relative w-full max-w-md h-full max-h-[900px] bg-black shadow-2xl overflow-hidden md:rounded-3xl border border-white/5">
            
            
            <div class="noise-overlay"></div>

            
            <div class="absolute inset-0 grid-pattern-dark pointer-events-none z-0"></div>

            
            <div id="progress-wrapper" class="progress-container"></div>

            
            <button onclick="closeRecap()" class="absolute top-8 right-6 z-[70] text-white/50 hover:text-white p-2 transition-colors">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>

            
            <div id="touch-left" class="absolute top-0 left-0 w-1/3 h-full z-40"></div>
            <div id="touch-right" class="absolute top-0 right-0 w-1/3 h-full z-40"></div>
            <div id="touch-hold" class="absolute top-0 left-1/3 w-1/3 h-full z-40"></div>

            
            <div id="slide-content" class="w-full h-full relative z-20">
                
            </div>

            
            <div id="slide-decor" class="absolute inset-0 z-10 transition-opacity duration-700">
                
            </div>

        </div>
    </div>

            },

                                <div class="text-center">

                            <div class="absolute -right-4 -top-4 w-20 h-20 bg-gradient-to-br from-pink-500 to-purple-500 rounded-full blur-xl opacity-50"></div>
                            
                            <h3 class="font-black text-xl mb-4 tracking-widest">GARA RECAP</h3>
                            <div class="grid grid-cols-2 gap-4 text-sm">
                                <div>
                                    <div class="opacity-50 text-xs">Tipe</div>
                                    <div class="font-bold">${data.persona.type}</div>
                                </div>
                                <div>
                                    <div class="opacity-50 text-xs">Streak</div>
                                    <div class="font-bold">${data.stats.streak} Hari</div>
                                </div>
                            </div>
                        </div>

                        <button class="w-full py-4 bg-white text-black font-bold text-lg rounded-full mb-4 shadow-[0_0_20px_rgba(255,255,255,0.3)] hover:scale-105 transition-transform animate-slide-up delay-500">

        ];

        
        
        
        let currentSlide = 0;
        let isPaused = false;
        let slideDuration = 6000;
        let progressInterval;
        let startTime;

        const appContainer = document.getElementById('app-container');
        const loadingScreen = document.getElementById('loading-screen');
        const storyViewport = document.getElementById('story-viewport');
        const slideContent = document.getElementById('slide-content');
        const slideDecor = document.getElementById('slide-decor');
        const progressWrapper = document.getElementById('progress-wrapper');

        window.addEventListener('load', () => {
            
            setTimeout(() => {
                loadingScreen.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => {
                   loadingScreen.style.display = 'none';
                   appContainer.classList.remove('hidden');
                   startStory();
                }, 1000);
            }, 3000); 
        });

        function startStory() {
            initProgressBars();
            showSlide(0);
        }

        function initProgressBars() {
            progressWrapper.innerHTML = '';
            slides.forEach((_, idx) => {
                const barContainer = document.createElement('div');
                barContainer.className = 'progress-bg';
                const fill = document.createElement('div');
                fill.className = 'progress-fill';
                fill.id = `progress-${idx}`;
                barContainer.appendChild(fill);
                progressWrapper.appendChild(barContainer);
            });
        }

        function showSlide(index) {
            if (index < 0 || index >= slides.length) {
                if(index >= slides.length) closeRecap();
                return;
            }
            currentSlide = index;
            slideContent.innerHTML = slides[index].render(userData);
            slideDecor.innerHTML = getDecor(index);
            resetProgressBars(index);
            startProgressBar(index);
        }

        function resetProgressBars(currentIndex) {
            slides.forEach((_, idx) => {
                const bar = document.getElementById(`progress-${idx}`);
                if (idx < currentIndex) {
                    bar.style.width = '100%';
                    bar.style.transition = 'none';
                } else {
                    bar.style.width = '0%';
                    bar.style.transition = 'none';
                }
            });
        }

        function startProgressBar(index) {
            clearInterval(progressInterval);
            startTime = Date.now();
            isPaused = false;
            const bar = document.getElementById(`progress-${index}`);
            
            progressInterval = setInterval(() => {
                if (!isPaused) {
                    const elapsed = Date.now() - startTime;
                    const percent = Math.min((elapsed / slideDuration) * 100, 100);
                    bar.style.width = `${percent}%`;

                    if (elapsed >= slideDuration) {
                        clearInterval(progressInterval);
                        nextSlide();
                    }
                } else {
                    startTime = Date.now() - ((parseFloat(bar.style.width) / 100) * slideDuration);
                }
            }, 16);
        }

        function nextSlide() { showSlide(currentSlide + 1); }
        function prevSlide() { if(currentSlide > 0) showSlide(currentSlide - 1); else showSlide(0); }

        function closeRecap() {
            clearInterval(progressInterval);
            appContainer.classList.add('opacity-0');
            setTimeout(() => {
                appContainer.classList.add('hidden');
                appContainer.classList.remove('opacity-0');
                alert("Recap Closed");
            }, 500);
        }

        const touchLeft = document.getElementById('touch-left');
        const touchRight = document.getElementById('touch-right');
        const touchHold = document.getElementById('touch-hold');

        touchRight.addEventListener('click', nextSlide);
        touchLeft.addEventListener('click', prevSlide);

        [touchLeft, touchRight, touchHold].forEach(area => {
            ['mousedown', 'touchstart'].forEach(evt => {
                area.addEventListener(evt, () => { 
                    isPaused = true; 
                    slideContent.classList.add('scale-[0.98]', 'transition-transform'); 
                });
            });
            ['mouseup', 'touchend', 'mouseleave'].forEach(evt => {
                area.addEventListener(evt, () => { 
                    isPaused = false; 
                    slideContent.classList.remove('scale-[0.98]'); 
                });
            });
        });

        document.addEventListener('keydown', (e) => {
            if (appContainer.classList.contains('hidden')) return;
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
            if (e.key === ' ') isPaused = true;
        });
        document.addEventListener('keyup', (e) => { if (e.key === ' ') isPaused = false; });

    </script>
</body>
</html>
