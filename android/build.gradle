allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

ext {
    flutter = [
        compileSdkVersion: 35,
        minSdkVersion: 21,
        targetSdkVersion: 35
    ]
    kotlin_version = "2.1.0"
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
    
    // Global Kotlin stdlib resolution to prevent metadata mismatches
    project.configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib')) {
                details.useVersion "2.1.0"
            }
        }
    }

    // Target older androidx.core version ONLY for flutter_windowmanager to prevent lStar resource linking error
    if (project.name == "flutter_windowmanager") {
        project.configurations.all {
            resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'androidx.core' && details.requested.name.startsWith('core')) {
                    details.useVersion "1.6.0"
                }
            }
        }
    }
}

subprojects {
    tasks.whenTaskAdded { task ->
        if (task.name.contains("extractDebugAnnotations") || task.name.contains("extractReleaseAnnotations")) {
            task.enabled = false
        }
    }
}

subprojects {
    // Buat file typedefs.txt kosong secara instan pada configuration phase
    // agar lolos validasi awal input file Gradle.
    def debugDir = new File(project.buildDir, "intermediates/annotations_typedef_file/debug/extractDebugAnnotations")
    if (!debugDir.exists()) debugDir.mkdirs()
    def debugFile = new File(debugDir, "typedefs.txt")
    if (!debugFile.exists()) debugFile.text = ""

    def releaseDir = new File(project.buildDir, "intermediates/annotations_typedef_file/release/extractReleaseAnnotations")
    if (!releaseDir.exists()) releaseDir.mkdirs()
    def releaseFile = new File(releaseDir, "typedefs.txt")
    if (!releaseFile.exists()) releaseFile.text = ""
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
subprojects {
    project.plugins.withId('com.android.library') {
        project.android {
            compileSdkVersion 35
            if (namespace == null) {
                try {
                    def manifestFile = project.file("src/main/AndroidManifest.xml")
                    if (manifestFile.exists()) {
                        def parsedManifest = new XmlParser().parse(manifestFile)
                        def packageName = parsedManifest.attribute("package")
                        if (packageName != null) {
                            namespace = packageName
                        }
                    }
                } catch (Exception e) {
                    // Ignore parsing exceptions
                }
            }
        }
    }
}
