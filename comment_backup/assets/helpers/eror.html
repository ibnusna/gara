<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Koneksi Terputus - GARA</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0B57D0;
            --bg: #F8FAFD;
            --text-main: #1F2937;
            --text-muted: #6B7280;
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 24px;
        }
        .container {
            max-width: 400px;
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .illustration {
            width: 200px;
            margin-bottom: 30px;
        }
        h1 {
            color: var(--text-main);
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 12px 0;
        }
        p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
            margin: 0 0 32px 0;
        }
        .btn-retry {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(11, 87, 208, 0.25);
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-retry:active {
            transform: scale(0.95);
            box-shadow: 0 4px 10px rgba(11, 87, 208, 0.2);
        }
        .footer {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 2px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- SVG Icon Offline -->
        <svg class="illustration" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM13 17H11V15H13V17ZM13 13H11V7H13V13Z" fill="#0B57D0"/>
        </svg>
        
        <h1>Koneksi Terputus</h1>
        <p>Gagal terhubung ke server GARA. Pastikan koneksi internet Anda aktif dan stabil.</p>
        
        <button class="btn-retry" onclick="retry()">Coba Lagi</button>
    </div>

    <div class="footer">GARUDA AKADEMI</div>

    <script>
        function retry() {
            
            if (window.AndroidInterface && window.AndroidInterface.retryLastUrl) {
                window.AndroidInterface.retryLastUrl();
            } else if (window.flutter_inappwebview) {
                window.flutter_inappwebview.callHandler('retryLastUrl');
            } else {
                location.reload();
            }
        }
    </script>
</body>
</html>
